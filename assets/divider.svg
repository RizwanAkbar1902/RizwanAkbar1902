<rect x="40" y="10" width="1120" height="4" rx="2" fill="url(#g)" filter="url(#gl)" opacity="0.9"/>
<circle cx="40" cy="12" r="6" fill="#ffffff" filter="url(#gl)"><animate attributeName="cx" values="40;1160;40" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="600" cy="12" r="5" fill="#bc8cff"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></circle>
